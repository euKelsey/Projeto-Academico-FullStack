name: CI Fast Splash

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  flutter:
    name: Validar Flutter e Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Verificar ambiente
        run: |
          java -version
          flutter --version
          dart --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analisar codigo
        run: flutter analyze

      - name: Executar testes
        run: flutter test

      - name: Compilar APK Android
        run: flutter build apk --debug

  backend-maven:
    name: Validar Backend Java com Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web/FastSplashWeb

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: web/FastSplashWeb/pom.xml

      - name: Verificar ambiente Maven
        run: bash ./mvnw -version

      - name: Compilar e testar backend
        run: bash ./mvnw -B clean verify

      - name: Verificar arquivo WAR
        run: test -s target/FastSplashWeb.war

  web-java:
    name: Validar Web Java e Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Construir imagem Docker
        run: |
          docker build -t fast-splash-web:ci ./web/FastSplashWeb

      - name: Verificar Java e Tomcat
        run: |
          docker run --rm fast-splash-web:ci java -version
          docker run --rm fast-splash-web:ci catalina.sh version

      - name: Iniciar backend
        run: |
          docker run -d \
            --name fast-splash-ci \
            -p 127.0.0.1:10000:10000 \
            fast-splash-web:ci

      - name: Testar resposta HTTP
        run: |
          curl --fail --retry 15 --retry-all-errors \
            --retry-delay 2 --max-time 10 \
            http://localhost:10000/

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker logs fast-splash-ci || true

      - name: Limpar ambiente
        if: always()
        run: docker rm -f fast-splash-ci || true
