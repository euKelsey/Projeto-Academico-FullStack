name: fast-splash-tests

services:
  mysql-test:
    image: mysql:8.4.9
    container_name: fast-splash-mysql-test

    environment:
      MYSQL_ROOT_PASSWORD: RootLocalTest@2026
      MYSQL_DATABASE: fast_splash_test
      MYSQL_USER: fastsplash_test
      MYSQL_PASSWORD: FastSplashLocalTest@2026

    ports:
      - "127.0.0.1:3308:3306"

    tmpfs:
      - /var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -D "$$MYSQL_DATABASE" -e "SELECT 1" > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  web-test:
    image: fast-splash-web:test
    container_name: fast-splash-web-test

    profiles:
      - api

    build:
      context: ./web/FastSplashWeb
      dockerfile: Dockerfile

    environment:
      PORT: "10000"
      FASTSPLASH_DB_URL: "jdbc:mysql://mysql-test:3306/fast_splash_test"
      FASTSPLASH_DB_USER: "fastsplash_test"
      FASTSPLASH_DB_PASSWORD: "FastSplashLocalTest@2026"

    ports:
      - "127.0.0.1:8081:10000"

    depends_on:
      mysql-test:
        condition: service_healthy

    restart: "no"
